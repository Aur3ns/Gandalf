name: Gandalf checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q gandalf.py tests/
      - name: Validate sample policy
        run: python gandalf.py --check-config
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v